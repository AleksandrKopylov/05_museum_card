<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Museum Card</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <section class="card">
            <header class="card_header">
                <img src="img/leonidas_1.jpg" alt="leonidas_1" class="card_img_person">
                <h1 class="card_name">Leonidas 1</h1>
                <h2 class="card_description">Lacedaemon king and hero</h2>
                <div class="card_date">
                    <p>480 BC</p>
                </div>
            </header>
        </section>
    </main>
</body>
</html>
